name: Release Desktop

on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--config src-tauri/tauri.release.generated.conf.json --bundles msi,nsis"
          - platform: macos-latest
            args: "--config src-tauri/tauri.release.generated.conf.json --bundles dmg,app"
          - platform: ubuntu-latest
            args: "--config src-tauri/tauri.release.generated.conf.json --bundles deb,appimage"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libpulse-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate application versions
        run: bun run check:versions

      - name: Prepare signed updater configuration
        env:
          RECORD_FORGE_UPDATER_PUBLIC_KEY: ${{ vars.RECORD_FORGE_UPDATER_PUBLIC_KEY }}
        run: bun run prepare:updater

      - name: Build overlay WASM
        run: bun run build:wasm:overlay

      - name: Stage FFmpeg sidecars
        run: bun run setup:ffmpeg

      - name: Validate TypeScript
        run: bun run typecheck

      - name: Validate tests
        run: bun run test

      - name: Validate Rust
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings

      - name: Build and publish GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: bun tauri
          args: ${{ matrix.args }}
          tagName: app-v__VERSION__
          releaseName: RecordForge v__VERSION__
          releaseBody: See the source tag and signed assets included in this release.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
