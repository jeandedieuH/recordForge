name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  format-and-lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install

      - name: Format check (TypeScript)
        run: bun run format:check

      - name: Lint (TypeScript)
        run: bun run lint

      - name: Format check (Rust)
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check

      - name: Clippy (Rust)
        working-directory: apps/desktop/src-tauri
        run: cargo clippy -- -D warnings

  typecheck:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run typecheck

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install

      - name: Download FFmpeg sidecar binaries
        run: bun run setup:ffmpeg

      - name: Test TypeScript packages
        run: bun run test

      - name: Test Rust
        working-directory: apps/desktop/src-tauri
        run: cargo test

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install

      - name: Download FFmpeg sidecar binaries
        run: bun run setup:ffmpeg

      - name: Build frontend
        working-directory: apps/desktop
        run: bun run build

      - name: Build Rust
        working-directory: apps/desktop/src-tauri
        run: cargo build --release
