name: CI

on:
  push:
    branches: [main,macos-and-linux-versions]
  pull_request:
    branches: [main]

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  format-and-lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install

      - name: Validate application versions
        run: bun run check:versions

      - name: Format check (TypeScript)
        run: bun run format:check

      - name: Lint (TypeScript)
        run: bun run lint

      - name: Download FFmpeg sidecar binaries
        run: bun run setup:ffmpeg

      - name: Format check (Rust)
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check

      - name: Clippy (Rust)
        working-directory: apps/desktop/src-tauri
        run: cargo clippy -- -D warnings

  typecheck:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run typecheck

  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify Apple Silicon environment
        if: runner.os == 'macOS'
        run: |
          echo "Host Architecture: $(uname -m)"
          echo "macOS Product Version: $(sw_vers -productVersion)"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Install dependencies
        run: bun install

      - name: Build overlay WASM
        run: bun run build:wasm:overlay

      - name: Download FFmpeg sidecar binaries
        run: bun run setup:ffmpeg

      - name: Test TypeScript packages
        run: bun run test

      - name: Test Rust
        working-directory: apps/desktop/src-tauri
        run: cargo test -- -j 1

      - name: Run macOS Apple Silicon E2E integration tests
        if: runner.os == 'macOS'
        working-directory: apps/desktop/src-tauri
        run: cargo test --test macos_e2e_integration_tests -- --nocapture

  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Install dependencies
        run: bun install

      - name: Build overlay WASM
        run: bun run build:wasm:overlay

      - name: Download FFmpeg sidecar binaries
        run: bun run setup:ffmpeg

      - name: Build frontend
        working-directory: apps/desktop
        run: bun run build

      - name: Build Rust
        working-directory: apps/desktop/src-tauri
        run: cargo build --release

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Install dependencies
        run: bun install

      - name: Build WASM packages
        run: bun run build:wasm
