# CLA Assistant — records Contributor License Agreement signatures on PRs.
# Signatures are stored in this repository's .clabot JSON file.
name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: >-
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: ".clabot"
          path-to-document: "https://github.com/jeandedieuH/recordForge/blob/main/CLA.md"
          branch: "main"
          allowlist: dependabot[bot],github-actions[bot],devin-ai-integration[bot]
          custom-notsigned-prcomment: >
            Thank you for your contribution! Before this PR can be merged, please sign
            the Contributor License Agreement — it lets the project ship your work in
            both the GPL codebase and the dual-licensed official builds.
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "All contributors have signed the CLA — thank you!"
          lock-pullrequest-aftermerge: false
