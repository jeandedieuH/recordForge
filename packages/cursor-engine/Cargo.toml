[package]
name = "cursor-engine"
version = "1.2.4"
edition = "2021"
authors = ["Prestige Tech"]
description = "Canonical cursor evaluation engine for preview and export"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2.99" }

[dev-dependencies]
serde_json = "1"
