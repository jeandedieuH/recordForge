[package]
name = "cursor-engine"
version = "2.2.1"
edition = "2021"
authors = ["Prestige Tech"]
description = "Canonical cursor evaluation engine for preview and export"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

# wasm-pack downloads binaryen per-run to run wasm-opt, and that download is a
# recurring flake on CI runners. These crates are small, so skip wasm-opt.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2.99" }

[dev-dependencies]
serde_json = "1"
