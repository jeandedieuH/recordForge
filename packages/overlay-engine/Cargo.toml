[package]
name = "overlay-engine"
version = "0.1.0"
edition = "2021"
authors = ["recordForge"]
description = "Canonical overlay evaluation engine for preview and export"
license = "MIT"
rust-version = "1.97.1"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
native-render = ["dep:tiny-skia", "dep:resvg"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tiny-skia = { version = "0.11.4", optional = true }
resvg = { version = "0.45.1", default-features = false, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2.99" }

[dev-dependencies]
serde_json = "1"
