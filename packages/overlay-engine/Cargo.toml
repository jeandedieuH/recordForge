[package]
name = "overlay-engine"
version = "2.3.2"
edition = "2021"
authors = ["Prestige Tech"]
description = "Canonical overlay evaluation engine for preview and export"
license = "GPL-3.0-or-later"
rust-version = "1.99.0"

[lib]
crate-type = ["cdylib", "rlib"]

# wasm-pack downloads binaryen per-run to run wasm-opt, and that download is a
# recurring flake on CI runners. These crates are small, so skip wasm-opt.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[features]
default = []
native-render = ["dep:tiny-skia", "dep:resvg", "dep:fontdb", "dep:svgtypes"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tiny-skia = { version = "0.11.4", optional = true }
resvg = { version = "0.45.1", default-features = false, features = ["text"], optional = true }
fontdb = { version = "0.23.0", features = ["memmap"], optional = true }
rustybuzz = "=0.20.1"
unicode-segmentation = "=1.12.0"
svgtypes = { version = "=0.15.3", optional = true }



[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2.99" }

[dev-dependencies]
serde_json = "1"
