<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RecordForge</title>
    <script>
      ;(function () {
        var params = new URLSearchParams(window.location.search)
        var kind = window.__RECORD_FORGE_WINDOW_KIND
        if (params.get("floating") === "1" || kind === "floating")
          document.documentElement.dataset.floating = "true"
        if (params.get("boundary") === "1" || kind === "boundary")
          document.documentElement.dataset.boundary = "true"
        if (params.get("countdown") === "1" || kind === "countdown")
          document.documentElement.dataset.countdown = "true"
        if (
          params.get("region") === "1" ||
          params.get("region_picker") === "1" ||
          kind === "region-picker" ||
          kind === "region"
        )
          document.documentElement.dataset.regionPicker = "true"

        try {
          var theme = localStorage.getItem("recordforge:theme") || "dark"
          var resolved =
            theme === "system"
              ? window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark"
              : theme
          if (resolved === "light") {
            document.documentElement.dataset.theme = "light"
          } else if (resolved === "dark") {
            document.documentElement.dataset.theme = "dark"
          }
        } catch (e) {
          // Ignore localStorage errors
        }

        // Prevent WebView2/browser from navigating away when files or text are dragged into the window
        window.addEventListener("dragover", function (e) {
          e.preventDefault()
        })
        window.addEventListener("drop", function (e) {
          e.preventDefault()
        })
      })()
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
