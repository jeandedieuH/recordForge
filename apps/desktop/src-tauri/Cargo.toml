[package]
name = "recordforge-desktop"
version = "0.1.0"
description = "Local-first screen recorder and lightweight editor"
authors = ["recordForge"]
edition = "2021"
rust-version = "1.78"

[lib]
name = "recordforge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.35", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "1"
chrono = { version = "0.4.40", features = ["serde"] }
uuid = { version = "1.15", features = ["v4", "serde"] }
regex = "1.11"

[target.'cfg(windows)'.dependencies]
wasapi = "0.23.0"
windows = { version = "0.60", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
opt-level = 3
