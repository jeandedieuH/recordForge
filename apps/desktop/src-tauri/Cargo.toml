[package]
name = "recordforge-desktop"
version = "1.0.0"
description = "Local-first screen recorder and lightweight editor"
authors = ["prestige-tech & recordForge contributors"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.97.1"

[lib]
name = "recordforge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.35", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "1"
chrono = { version = "0.4.40", features = ["serde"] }
uuid = { version = "1.15", features = ["v4", "serde"] }
regex = "1.11"
sha2 = "0.10.9"
hex = "0.4.3"
cursor-engine = { path = "../../../packages/cursor-engine" }
overlay-engine = { path = "../../../packages/overlay-engine", features = ["native-render"] }
resvg = { version = "0.45.1", default-features = false, features = ["text"] }
tiny-skia = "0.11.4"
fontdb = { version = "0.23.0", features = ["memmap"] }
base64 = "0.22"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }

[target.'cfg(windows)'.dependencies]
wasapi = "0.23.0"
windows = { version = "0.60", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Media", "Win32_Security_Credentials"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
opt-level = 3
