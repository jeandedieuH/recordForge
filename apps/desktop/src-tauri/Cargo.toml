[package]
name = "recordforge-desktop"
version = "0.1.0"
description = "Local-first screen recorder and lightweight editor"
authors = ["recordForge"]
edition = "2021"
rust-version = "1.78"

[lib]
name = "recordforge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.35", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "1"

[profile.release]
strip = true
lto = true
opt-level = 3
