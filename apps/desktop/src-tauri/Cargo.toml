[package]
name = "recordforge-desktop"
version = "2.3.0"
description = "Local-first screen recorder and lightweight editor"
authors = ["prestige-tech & RecordForge contributors"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.99.0"
default-run = "recordforge-desktop"

[lib]
name = "recordforge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
export-harness = []

[[bin]]
name = "export_harness"
path = "src/bin/export_harness.rs"
required-features = ["export-harness"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png", "macos-private-api"] }
# A tray app must be a single process: a second launch would add another tray
# icon and another instance holding the executable the updater has to replace.
tauri-plugin-single-instance = "2.5.4"
# Native notifications (used for the one-time close-to-tray hint). Native so it
# also shows while the webview is minimized.
tauri-plugin-notification = "2.7.0"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.35", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "1"
chrono = { version = "0.4.40", features = ["serde"] }
uuid = { version = "1.15", features = ["v4", "serde"] }
regex = "1.11"
sha2 = "0.10.9"
hex = "0.4.3"
cursor-engine = { path = "../../../packages/cursor-engine" }
overlay-engine = { path = "../../../packages/overlay-engine", features = ["native-render"] }
resvg = { version = "0.45.1", default-features = false, features = ["text"] }
tiny-skia = "0.11.4"
fontdb = { version = "0.23.0", features = ["memmap"] }
base64 = "0.22"
hmac = "0.12"
ed25519-dalek = "2"
machine-uid = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["time"] }
futures-util = { version = "0.3", default-features = false }
# `deflate` restores the decompressor — without it every engine zip (Windows
# x64 upstream + self-hosted macOS/ARM64) fails extraction at the first entry.
zip = { version = "2", default-features = false, features = ["deflate"] }
# whisper.cpp ships the Linux engine as .tar.gz (macOS/Windows use .zip above).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
# Exact pin matching overlay-engine: the caption ASS writer measures text with
# HarfBuzz so chip widths and line centers match the editor-core estimator.
rustybuzz = "=0.20.1"
# Native GPU export compositor (ADR 018, Phase 5). FFmpeg keeps decode/encode;
# wgpu only composites the frames the FFmpeg graph used to blend. Pinned to a
# release older than 7 days; DX12/Vulkan/Metal/GLES cover every V1 target.
wgpu = { version = "30.0.1", default-features = false, features = [
    "std",
    "wgsl",
    "dx12",
    "metal",
    "vulkan",
    "gles",
] }

[target.'cfg(windows)'.dependencies]
wasapi = "0.23.0"
# Must stay on the same minor version wry/tauri resolve so PlatformWebview
# COM types are identical — wry 0.57 pins webview2-com 0.39.
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Performance", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Media", "Win32_Security_Credentials"] }

[target.'cfg(not(windows))'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native", "sync-secret-service"] }

[target.'cfg(target_os = "macos")'.dependencies]
# CoreGraphics/CoreFoundation give us real display + window enumeration and
# the TCC preflight calls, without pulling the heavier objc2 ScreenCaptureKit
# stack Phase 1 needs. Both are already in the lockfile via tao/wry.
core-foundation = "0.10.1"
core-graphics = "0.25.0"
# Safe ScreenCaptureKit bindings (SCStream video + system audio, macOS 13+).
screencapturekit = "11.0.0"
# POSIX pipe/fcntl/dup2 for the fd-3 frame pipe into the FFmpeg child.
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Sync D-Bus client for the XDG ScreenCast portal (Wayland capture consent).
# `dbus` is already resolved transitively via dbus-secret-service/keyring.
dbus = "0.9"
# PipeWire screen capture: compositor frames from the portal-granted remote
# fd, packed and piped into FFmpeg. Needs libpipewire-0.3-dev at build time.
pipewire = "0.10"
libspa-sys = "0.10"
libc = "0.2"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.13.3"

[dev-dependencies]
tempfile = "3"

# Vendored fork of upstream libspa 0.10.1 that also compiles against PipeWire
# < 1.0 headers (e.g. Ubuntu 22.04's libpipewire-0.3-dev 0.3.48): upstream
# unconditionally uses `spa_video_info_raw.flags` and calls
# `spa_meta_first`/`spa_meta_region_is_valid`, which are plain #define macros
# on those headers and invisible to bindgen. The vendored crate detects the
# header generation in its build script and falls back to a C compat shim —
# see vendor/libspa/README-vendored.md. libspa-sys and pipewire stay stock.
[patch.crates-io]
libspa = { path = "../../../vendor/libspa" }

[profile.release]
strip = true
lto = true
opt-level = 3
