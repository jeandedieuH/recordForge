<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}}</title>
    <meta name="description" content="Shared with RecordForge" />
    <meta property="og:title" content="{{TITLE}}" />
    <meta property="og:type" content="video.other" />
    <meta property="og:video" content="video.mp4" />
    <meta property="og:video:type" content="video/mp4" />
    <meta name="twitter:card" content="player" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          sans-serif;
        background: #0a0a0b;
        color: #fafafa;
      }
      .shell {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
        gap: 1.5rem;
      }
      .frame {
        width: min(100%, 1100px);
      }
      video {
        width: 100%;
        border-radius: 12px;
        background: #000;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
        display: block;
      }
      .title {
        font-size: 1.125rem;
        font-weight: 600;
        text-align: center;
      }
      .meta {
        font-size: 0.8125rem;
        color: #a1a1aa;
        text-align: center;
      }
      .chapters {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        justify-content: center;
      }
      .chapters button {
        border: 1px solid #3f3f46;
        background: transparent;
        color: #d4d4d8;
        padding: 0.375rem 0.75rem;
        border-radius: 999px;
        font: inherit;
        font-size: 0.8125rem;
        cursor: pointer;
        transition:
          border-color 0.15s,
          color 0.15s;
      }
      .chapters button:hover {
        border-color: #10b981;
        color: #10b981;
      }
      .actions {
        display: flex;
        gap: 0.75rem;
        justify-content: center;
      }
      .actions a {
        border: 1px solid #3f3f46;
        background: transparent;
        color: #e4e4e7;
        padding: 0.5rem 1rem;
        border-radius: 8px;
        font-size: 0.875rem;
        text-decoration: none;
        transition: border-color 0.15s;
      }
      .actions a:hover {
        border-color: #a1a1aa;
      }
      footer {
        padding: 1.25rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        font-size: 0.75rem;
        color: #52525b;
      }
      footer .brand {
        color: #a1a1aa;
        font-weight: 600;
        text-decoration: none;
      }
      footer .brand:hover {
        color: #fafafa;
      }
      footer .cta {
        border: 1px solid #3f3f46;
        color: #10b981;
        border-radius: 999px;
        padding: 0.25rem 0.75rem;
        text-decoration: none;
        font-weight: 500;
        transition: border-color 0.15s;
      }
      footer .cta:hover {
        border-color: #10b981;
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="frame">
        <!-- ?v= can point the player at a different file; default is video.mp4
           in the same folder so the bare link just works. -->
        <video id="video" controls playsinline preload="metadata"></video>
        <div style="display: flex; flex-direction: column; gap: 1rem; padding-top: 1rem">
          <p class="title">{{TITLE}}</p>
          <p class="meta" id="meta"></p>
          <div class="chapters" id="chapters"></div>
          <div class="actions" id="actions"></div>
        </div>
      </div>
    </main>
    <!-- Share-page branding — same credit/CTA pattern as the hosted viewer;
         utm tags let the marketing site attribute share-page traffic. -->
    <footer>
      <a
        class="brand"
        href="https://recordforge.prestigetech.dev?utm_source=sharable_link&utm_medium=web&utm_campaign=logo"
        target="_blank"
        rel="noopener"
        >RecordForge</a
      >
      <span>Recorded and shared using RecordForge</span>
      <a
        class="cta"
        href="https://recordforge.prestigetech.dev/pricing?utm_source=share_page&utm_medium=web&utm_campaign=cta"
        target="_blank"
        rel="noopener"
        >Get RecordForge</a
      >
    </footer>
    <script>
      // Injected at upload time by the RecordForge desktop app.
      const CHAPTERS = JSON.parse(atob("%%CHAPTERS_B64%%"))
      const HAS_CAPTIONS = "%%HAS_CAPTIONS%%" === "1"
      const ALLOW_DOWNLOAD = "%%ALLOW_DOWNLOAD%%" === "1"

      const video = document.getElementById("video")
      const params = new URLSearchParams(location.search)
      video.src = params.get("v") || "video.mp4"
      if (HAS_CAPTIONS) {
        const track = document.createElement("track")
        track.kind = "captions"
        track.label = "Captions"
        track.srclang = "en"
        track.src = "captions.vtt"
        track.default = true
        video.appendChild(track)
      }

      video.addEventListener("loadedmetadata", () => {
        const t = Math.round(video.duration)
        document.getElementById("meta").textContent =
          Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0")
      })

      const fmt = (ms) => {
        const t = Math.round(ms / 1000)
        const h = Math.floor(t / 3600),
          m = Math.floor((t % 3600) / 60),
          s = t % 60
        return (h ? h + ":" : "") + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0")
      }
      for (const ch of CHAPTERS) {
        const b = document.createElement("button")
        b.textContent = fmt(ch.t) + " " + ch.label
        b.onclick = () => {
          video.currentTime = ch.t / 1000
          video.play()
        }
        document.getElementById("chapters").appendChild(b)
      }
      if (ALLOW_DOWNLOAD) {
        const a = document.createElement("a")
        a.textContent = "Download"
        a.href = video.src
        a.download = ""
        document.getElementById("actions").appendChild(a)
      }
    </script>
  </body>
</html>
