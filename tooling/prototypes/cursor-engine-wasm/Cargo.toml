[package]
name = "cursor-engine-wasm-proto"
version = "1.4.0"
edition = "2021"
authors = ["Prestige Tech"]
description = "Throwaway Rust+WASM cursor evaluator prototype for Phase 0"
license = "GPL-3.0-or-later"
autotests = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2.99", features = ["serde-serialize"] }

[[bin]]
name = "parity_test"
path = "tests/parity.rs"
